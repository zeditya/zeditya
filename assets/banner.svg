<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aditya Bahuguna — third-semester CSE student, building in public">
  <title>Aditya Bahuguna</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080B10"/>
      <stop offset="0.55" stop-color="#0B1017"/>
      <stop offset="1" stop-color="#07161C"/>
    </linearGradient>
    <linearGradient id="rule" x1="72" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EAFFFF"/>
      <stop offset="0.45" stop-color="#5FF3FF"/>
      <stop offset="1" stop-color="#00A8C4"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#00E5FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="230" fill="url(#glow)"/>

  <!-- copy -->
  <text x="72" y="98" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="6" fill="#00E5FF" fill-opacity="0.85">PROFILE / ZEDITYA</text>
  <text x="70" y="182" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="1" fill="#F0F6FC">ADITYA BAHUGUNA</text>
  <rect x="72" y="206" width="228" height="2" fill="url(#rule)"/>
  <text x="72" y="252" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="0.4" fill="#8B949E">Third-semester CSE student · building in public, one commit at a time</text>

  <!-- arc reactor -->
  <g stroke="#00E5FF" fill="none">
    <circle cx="1010" cy="160" r="96" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="1010" cy="160" r="80" stroke-opacity="0.30" stroke-width="1.5" stroke-dasharray="3 9"/>
    <circle cx="1010" cy="160" r="64" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1010" cy="160" r="50" stroke-opacity="0.85" stroke-width="2"/>
  </g>
  <g fill="#00E5FF">
    <rect x="1006" y="96" width="8" height="4" rx="2" fill-opacity="0.9"/>
    <rect x="1006" y="220" width="8" height="4" rx="2" fill-opacity="0.9"/>
    <rect x="946" y="156" width="4" height="8" rx="2" fill-opacity="0.9"/>
    <rect x="1070" y="156" width="4" height="8" rx="2" fill-opacity="0.9"/>
    <circle cx="1010" cy="160" r="30" fill="url(#core)"/>
  </g>
  <circle cx="1010" cy="160" r="30" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

  <rect y="318" width="1200" height="2" fill="url(#edge)"/>
</svg>
